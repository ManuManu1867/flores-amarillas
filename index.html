<title>Ramo de flores amarillas</title>

<style>

/* =========================================
   CONFIGURACIÓN GENERAL
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    background: #ffffff;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    background: #ffffff;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px 10px;

    overflow-x: hidden;
}

.ramo {
    width: min(100%, 640px);
    margin: auto;
}

svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
}


/* =========================================
   ANIMACIÓN DE LAS FLORES
========================================= */

.flor {
    opacity: 0;

    transform-box: fill-box;
    transform-origin: center bottom;

    animation:
        aparecerFlor 2.2s
        cubic-bezier(0.22, 1, 0.36, 1)
        forwards;
}

@keyframes aparecerFlor {

    0% {
        opacity: 0;
        transform: translateY(22px) scale(0.5);
    }

    60% {
        opacity: 1;
        transform: translateY(-4px) scale(1.05);
    }

    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =========================================
   APARICIÓN DEL PAPEL
========================================= */

.papel {
    opacity: 0;

    animation:
        aparecerPapel 1.4s
        ease-out 0.2s
        forwards;
}

@keyframes aparecerPapel {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


/* =========================================
   APARICIÓN DEL LAZO
========================================= */

.lazo {
    opacity: 0;

    animation:
        aparecerLazo 1.4s
        ease-out 1.6s
        forwards;
}

@keyframes aparecerLazo {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


/* =========================================
   APARICIÓN DE TALLOS Y HOJAS
========================================= */

.tallos-arriba,
.tallos-abajo,
.hojas {
    opacity: 0;

    animation:
        aparecerTallos 1.4s
        ease-out 3.0s
        forwards;
}

@keyframes aparecerTallos {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


/* =========================================
   APARICIÓN ALTERNADA DE LAS FLORES
   IZQUIERDA → DERECHA → CENTRO
========================================= */

.f1  { animation-delay: 4.4s; }
.f20 { animation-delay: 4.95s; }
.f2  { animation-delay: 5.5s; }
.f19 { animation-delay: 6.05s; }

.f4  { animation-delay: 7.7s; }
.f17 { animation-delay: 8.25s; }

.f16 { animation-delay: 9.35s; }
.f6  { animation-delay: 9.9s; }
.f15 { animation-delay: 10.45s; }
.f7  { animation-delay: 11.0s; }

.f8  { animation-delay: 12.1s; }

.f9  { animation-delay: 13.2s; }

.f10 { animation-delay: 14.3s; }
.f11 { animation-delay: 15.4s; }


/* =========================================
   REDUCCIÓN DE MOVIMIENTO
========================================= */

@media (prefers-reduced-motion: reduce) {

    .flor,
    .papel,
    .lazo,
    .tallos-arriba,
    .tallos-abajo,
    .hojas {

        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        opacity: 1;

    }

}

</style>
