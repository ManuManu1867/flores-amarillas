<style>

/* =========================================
   CONFIGURACIÓN GENERAL
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    background: #ffffff;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    background: #ffffff;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px 10px;

    overflow-x: hidden;
}

.ramo {
    width: min(100%, 640px);
    margin: auto;
}

svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
}


/* =========================================
   ANIMACIÓN DE LAS FLORES
========================================= */

.flor {
    opacity: 0;

    transform-box: fill-box;
    transform-origin: center bottom;

    animation:
        aparecerFlor 2.2s
        cubic-bezier(0.22, 1, 0.36, 1)
        forwards;
}

@keyframes aparecerFlor {

    0% {
        opacity: 0;
        transform: translateY(22px) scale(0.5);
    }

    60% {
        opacity: 1;
        transform: translateY(-4px) scale(1.05);
    }

    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =========================================
   APARICIÓN DE IZQUIERDA A DERECHA
========================================= */

.f1  { animation-delay: 0.3s; }
.f2  { animation-delay: 0.85s; }
.f3  { animation-delay: 1.4s; }
.f4  { animation-delay: 1.95s; }
.f5  { animation-delay: 2.5s; }
.f6  { animation-delay: 3.05s; }
.f7  { animation-delay: 3.6s; }
.f8  { animation-delay: 4.15s; }
.f9  { animation-delay: 4.7s; }
.f10 { animation-delay: 5.25s; }
.f11 { animation-delay: 5.8s; }
.f12 { animation-delay: 6.35s; }
.f13 { animation-delay: 6.9s; }
.f14 { animation-delay: 7.45s; }
.f15 { animation-delay: 8.0s; }
.f16 { animation-delay: 8.55s; }
.f17 { animation-delay: 9.1s; }
.f18 { animation-delay: 9.65s; }
.f19 { animation-delay: 10.2s; }
.f20 { animation-delay: 10.75s; }


/* =========================================
   APARICIÓN DEL PAPEL
========================================= */

.papel {
    opacity: 0;

    animation:
        aparecerPapel 1.4s
        ease-out 0.2s
        forwards;
}

@keyframes aparecerPapel {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


/* =========================================
   TALLOS INFERIORES
   SINCRONIZADOS CON LAS FLORES DE ARRIBA
========================================= */

.tallos-abajo {
    opacity: 0;

    animation:
        aparecerTallos 1.4s
        ease-out 0.3s
        forwards;
}

@keyframes aparecerTallos {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


/* =========================================
   REDUCCIÓN DE MOVIMIENTO
========================================= */

@media (prefers-reduced-motion: reduce) {

    .flor,
    .papel,
    .tallos-abajo {

        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        opacity: 1;

    }

}

</style>
